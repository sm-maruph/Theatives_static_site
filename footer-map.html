<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theatives — Footer Location Map</title>
<style>
  :root {
    --map-bg: #0a0b0d;
    --dot: #2a2e38;
    --accent: #ff3b3b;
    --accent-glow: rgba(255, 59, 59, 0.35);
    --text: #e8e9ec;
    --text-dim: #8b8f99;
  }

  * { box-sizing: border-box; }

  html,
  body {
    overflow: hidden;
  }

  body {
    margin: 0;
    background: transparent;
    font-family: -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 16px;
  }

  /* ============ FOOTER LOCATIONS COMPONENT ============ */
  .tv-locations {
    width: 100%;
    max-width: 980px;
    background: transparent;
    border-radius: 18px;
    padding: 40px clamp(20px, 5vw, 56px) 32px;
    position: relative;
  }

  .tv-locations__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .tv-locations__title {
    color: var(--text);
    font-size: 18px;
    letter-spacing: 0.02em;
    margin: 0;
    font-weight: 500;
  }

  .tv-locations__legend {
    display: flex;
    gap: 20px;
    font-size: 15px;
    color: var(--text-dim);
  }

  .tv-locations__legend span {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .tv-locations__legend i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  .tv-map {
    position: relative;
    width: 100%;
    line-height: 0;
    border-radius: 12px;
    overflow: hidden;
    background: transparent;
  }

  .tv-map svg {
    width: 100%;
    height: auto;
    display: block;
    touch-action: none;
    cursor: default;
  }

  .tv-map svg.tv-can-pan {
    cursor: grab;
  }

  .tv-map svg.is-panning {
    cursor: grabbing;
  }

  .tv-map circle.tv-dot {
    fill: var(--dot);
  }

  /* Marker: outer pulse ring + solid core. Counter-scaled so it reads
     the same size regardless of zoom level. */
  .tv-marker { cursor: pointer; }

  .tv-marker .tv-marker__ping {
    fill: var(--accent);
    opacity: 0.55;
    transform-box: fill-box;
    transform-origin: center;
    animation: tv-ping 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
  }

  .tv-marker .tv-marker__core {
    fill: var(--accent);
    filter: drop-shadow(0 0 3px var(--accent-glow));
  }

  .tv-marker:nth-of-type(2) .tv-marker__ping {
    animation-delay: 1.2s;
  }

  @keyframes tv-ping {
    0%   { r: 0.7; opacity: 0.55; }
    75%  { r: 3; opacity: 0; }
    100% { r: 3; opacity: 0; }
  }

  /* Zoom controls */
  .tv-zoom {
    position: absolute;
    right: 12px;
    bottom: 12px;
    display: flex;
    flex-direction: column;
    background: #16171b;
    border: 1px solid #2a2c33;
    border-radius: 10px;
    overflow: hidden;
    z-index: 6;
  }

  .tv-zoom button {
    width: 44px;
    height: 44px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 21px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tv-zoom button:hover {
    background: #202228;
  }

  .tv-zoom button + button {
    border-top: 1px solid #2a2c33;
  }

  /* Tooltip — appended to <body> and positioned with position:fixed so
     it always renders above the map/page regardless of ancestor
     overflow or stacking context, and never gets clipped or fought
     over by other elements. Only one is ever shown at a time, so two
     markers can never show overlapping tooltip text. */
  .tv-tooltip {
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, calc(-100% - 14px));
    background: #16171b;
    border: 1px solid #2a2c33;
    border-radius: 10px;
    padding: 9px 13px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.12s ease, transform 0.12s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 99999;
  }

  .tv-tooltip.is-visible {
    opacity: 1;
    transform: translate(-50%, calc(-100% - 20px));
  }

  .tv-tooltip__place {
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    display: block;
  }

  .tv-tooltip__role {
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    display: block;
    margin-top: 2px;
  }

  .tv-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #16171b;
  }

  .tv-mobile-label {
    display: none;
  }

  @media (max-width: 640px) {
    .tv-locations { padding: 18px 0 16px; border-radius: 14px; }
    .tv-locations__head { padding: 0 14px; }
    .tv-locations__legend { display: none; }
    .tv-map {
      height: 360px;
      overflow: visible;
    }
    .tv-map svg {
      height: 100%;
      transform: scale(1.32);
      transform-origin: center;
    }
    .tv-mobile-label {
      position: absolute;
      z-index: 7;
      display: block;
      transform: translate(-50%, calc(-100% - 10px));
      padding: 7px 10px;
      border: 1px solid #2a2c33;
      border-radius: 7px;
      background: #16171b;
      box-shadow: 0 6px 18px rgba(0,0,0,.42);
      white-space: nowrap;
      pointer-events: none;
      line-height: 1.25;
    }
    .tv-mobile-label strong {
      display: block;
      color: var(--text);
      font-size: 12px;
    }
    .tv-mobile-label span {
      display: block;
      margin-top: 2px;
      color: var(--accent);
      font-size: 10px;
    }
  }
</style>
</head>

          <circle class="tv-marker__ping" cx="69.5" cy="20.78" r="0.7"></circle>
          <circle class="tv-marker__core" cx="69.5" cy="20.78" r="0.75"></circle>
        </g>
      </g>
    </svg>

    <div class="tv-zoom">
      <button type="button" id="tvZoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="tvZoomOut" aria-label="Zoom out">&minus;</button>
      <button type="button" id="tvZoomReset" aria-label="Reset zoom" style="font-size:16px;">&#8634;</button>
    </div>
  </div>
</div>

<div class="tv-tooltip" id="tvTooltip">
  <span class="tv-tooltip__place" id="tvTooltipPlace"></span>
  <span class="tv-tooltip__role" id="tvTooltipRole"></span>
</div>

<script>
(function () {
  var svg = document.getElementById('tvSvg');
  var zoomLayer = document.getElementById('tvZoomLayer');
  var mapEl = document.getElementById('tvMap');
  var tooltip = document.getElementById('tvTooltip');
  var tooltipPlace = document.getElementById('tvTooltipPlace');
  var tooltipRole = document.getElementById('tvTooltipRole');
  var markers = mapEl.querySelectorAll('.tv-marker');
  var mobileLabels = [];

  markers.forEach(function (marker) {
    var label = document.createElement('div');
    label.className = 'tv-mobile-label';
    label.innerHTML = '<strong>' + marker.getAttribute('data-place') + '</strong><span>' + marker.getAttribute('data-role') + '</span>';
    mapEl.appendChild(label);
    mobileLabels.push({ marker: marker, label: label });
  });

  var VB_X = -2, VB_Y = -2, BASE_W = 95, BASE_H = 50; // matches viewBox
  var MIN_SCALE = 1, MAX_SCALE = 8;

  var state = { scale: 1, tx: 0, ty: 0 };

  function applyTransform() {
    zoomLayer.setAttribute('transform',
      'translate(' + state.tx + ' ' + state.ty + ') scale(' + state.scale + ')');
    updatePanAvailability();
    requestAnimationFrame(updateMobileLabels);
  }

  function updateMobileLabels() {
    var mapRect = mapEl.getBoundingClientRect();
    mobileLabels.forEach(function (item) {
      var coreRect = item.marker.querySelector('.tv-marker__core').getBoundingClientRect();
      item.label.style.left = (coreRect.left + coreRect.width / 2 - mapRect.left) + 'px';
      item.label.style.top = (coreRect.top + coreRect.height / 2 - mapRect.top) + 'px';
    });
  }

  function updatePanAvailability() {
    // panning only makes sense once you've zoomed in — at the default
    // fully-zoomed-out view the whole map already fits, so dragging is
    // disabled and the cursor reflects that.
    svg.classList.toggle('tv-can-pan', state.scale > 1);
  }

  function clampPan() {
    // Keep the map content fully covering the viewBox at all times, so
    // dragging can never pull an edge inward and reveal empty space —
    // it stops flush at the border instead of trailing off oddly.
    var scaledW = BASE_W * state.scale;
    var scaledH = BASE_H * state.scale;
    var minTx = (VB_X + BASE_W) - scaledW;
    var maxTx = VB_X;
    var minTy = (VB_Y + BASE_H) - scaledH;
    var maxTy = VB_Y;
    state.tx = Math.max(minTx, Math.min(maxTx, state.tx));
    state.ty = Math.max(minTy, Math.min(maxTy, state.ty));
  }

  // Zoom toward a specific point given in SVG user-space coordinates
  function zoomAt(userX, userY, factor) {
    var newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, state.scale * factor));
    if (newScale === state.scale) return;
    var ratio = newScale / state.scale;
    state.tx = userX - ratio * (userX - state.tx);
    state.ty = userY - ratio * (userY - state.ty);
    state.scale = newScale;
    clampPan();
    applyTransform();
    hideTooltip();
  }

  function svgPointFromClient(clientX, clientY) {
    var pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    var ctm = svg.getScreenCTM().inverse();
    return pt.matrixTransform(ctm);
  }

  // --- zoom buttons ---
  document.getElementById('tvZoomIn').addEventListener('click', function () {
    zoomAt(BASE_W / 2, BASE_H / 2, 1.6);
  });
  document.getElementById('tvZoomOut').addEventListener('click', function () {
    zoomAt(BASE_W / 2, BASE_H / 2, 1 / 1.6);
  });
  document.getElementById('tvZoomReset').addEventListener('click', function () {
    state.scale = 1; state.tx = 0; state.ty = 0;
    applyTransform();
    hideTooltip();
  });

  // --- scroll wheel zoom, centered on cursor ---
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    var p = svgPointFromClient(e.clientX, e.clientY);
    var userPt = { x: (p.x - state.tx) / state.scale, y: (p.y - state.ty) / state.scale };
    zoomAt(userPt.x, userPt.y, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  // --- drag to pan (mouse) — only active once zoomed in ---
  var dragging = false, lastX = 0, lastY = 0;
  svg.addEventListener('mousedown', function (e) {
    if (state.scale <= 1) return;
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    svg.classList.add('is-panning');
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var scaleRatio = svg.viewBox.baseVal.width / svg.getBoundingClientRect().width;
    state.tx += (e.clientX - lastX) * scaleRatio;
    state.ty += (e.clientY - lastY) * scaleRatio;
    lastX = e.clientX; lastY = e.clientY;
    clampPan();
    applyTransform();
    hideTooltip();
  });
  window.addEventListener('mouseup', function () {
    dragging = false;
    svg.classList.remove('is-panning');
  });

  // --- touch: 1 finger pan, 2 finger pinch zoom ---
  var touchState = {};
  svg.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) {
      touchState.panning = state.scale > 1;
      touchState.lastX = e.touches[0].clientX;
      touchState.lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      touchState.panning = false;
      touchState.pinchDist = touchDistance(e.touches);
      var mid = touchMidpoint(e.touches);
      touchState.pinchOrigin = svgPointFromClient(mid.x, mid.y);
    }
  }, { passive: true });

  svg.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (e.touches.length === 1 && touchState.panning) {
      var scaleRatio = svg.viewBox.baseVal.width / svg.getBoundingClientRect().width;
      var dx = (e.touches[0].clientX - touchState.lastX) * scaleRatio;
      var dy = (e.touches[0].clientY - touchState.lastY) * scaleRatio;
      state.tx += dx; state.ty += dy;
      touchState.lastX = e.touches[0].clientX;
      touchState.lastY = e.touches[0].clientY;
      clampPan();
      applyTransform();
    } else if (e.touches.length === 2) {
      var newDist = touchDistance(e.touches);
      var factor = newDist / touchState.pinchDist;
      touchState.pinchDist = newDist;
      var userPt = {
        x: (touchState.pinchOrigin.x - state.tx) / state.scale,
        y: (touchState.pinchOrigin.y - state.ty) / state.scale
      };
      zoomAt(userPt.x, userPt.y, factor);
    }
  }, { passive: false });

  svg.addEventListener('touchend', function (e) {
    if (e.touches.length === 0) touchState.panning = false;
  });

  function touchDistance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function touchMidpoint(touches) {
    return {
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2
    };
  }

  // --- marker tooltip (single shared element, position:fixed on body,
  //     so it always sits above everything and only one can ever be
  //     visible at once — they can never overlap each other) ---
  markers.forEach(function (marker) {
    marker.addEventListener('mouseenter', function () { if (window.innerWidth > 640) showTooltip(marker); });
    marker.addEventListener('mousemove', function () { if (window.innerWidth > 640) showTooltip(marker); });
    marker.addEventListener('mouseleave', hideTooltip);
    marker.addEventListener('touchstart', function (e) {
      e.stopPropagation();
    });
  });

  window.addEventListener('resize', updateMobileLabels);
  requestAnimationFrame(updateMobileLabels);

  document.addEventListener('touchstart', function (e) {
    if (!e.target.closest('.tv-marker')) hideTooltip();
  });

  function showTooltip(marker) {
    // Read the marker's actual rendered position straight from the DOM —
    // this already accounts for zoom/pan/scroll/page layout with no
    // manual matrix math, so it can't drift out of sync.
    var core = marker.querySelector('.tv-marker__core');
    var rect = core.getBoundingClientRect();
    var x = rect.left + rect.width / 2;
    var y = rect.top + rect.height / 2;

    tooltipPlace.textContent = marker.getAttribute('data-place');
    tooltipRole.textContent = marker.getAttribute('data-role');

    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
    tooltip.classList.add('is-visible');
  }

  function hideTooltip() {
    tooltip.classList.remove('is-visible');
  }
})();
</script>

</body>
</html>
